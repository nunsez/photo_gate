<div>
  <div style="margin-bottom: 2rem; display: flex; justify-content: center">
    <!-- BUG -->
    @include './pagination.html'
  </div>

  <div style="margin-bottom: 2rem;">
    <!-- BUG -->
    @include './search.html'
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 2rem">
    @for picture in result.items
    <div
      id="@{picture.path}"
      style="display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 500px"
    >
      <a style="display: block" href="@{picture.path}">
        <img
          src="@{picture.path}"
          loading="lazy"
          style="
            display: block;
            object-fit: contain;
            object-position: bottom;
            aspect-ratio: 1;
            width: 100%;
            height: 100%;
          "
        />
      </a>
      <div style="display: flex; gap: 2rem">
        <button onclick="accept('@{picture.path}')" style="color: green; font-size: 2rem">ACCEPT</button>
        <button onclick="pending('@{picture.path}')" style="color: yellow; font-size: 2rem">PENDING</button>
        <button onclick="remove('@{picture.path}')" style="color: red; font-size: 2rem">REMOVE</button>
      </div>
    </div>
    @end
  </div>
</div>

<script>
  async function accept(src) {
    const body = JSON.stringify({ src });
    const result = await fetch("/accept", { method: "POST", body, headers: { "Content-Type": "application/json" } });
    if (result.ok) {
      document.getElementById(src)?.remove();
    }
  }

  async function pending(src) {
    const body = JSON.stringify({ src });
    const result = await fetch("/pending", { method: "POST", body, headers: { "Content-Type": "application/json" } });
    if (result.ok) {
      document.getElementById(src)?.remove();
    }
  }

  async function remove(src) {
    const body = JSON.stringify({ src });
    const result = await fetch("/remove", { method: "POST", body, headers: { "Content-Type": "application/json" } });
    if (result.ok) {
      document.getElementById(src)?.remove();
    }
  }
</script>
