<div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
  <div>
    <img id="pending-image" src="@pending_picture.path" style="width: auto; height: 750px;" />
  </div>

  <div style="display: flex; gap: 3rem;">
    <form method="POST" action="/accept">
      <input type="hidden" name="src" value="@pending_picture.path" />
      <button type="submit" style="color: green; font-size: 3rem;">ACCEPT</button>
    </form>

    <form method="POST" action="/decline">
      <input type="hidden" name="src" value="@pending_picture.path" />
      <button type="submit" style="color: red; font-size: 3rem;">DECLINE</button>
    </form>
  </div>
</div>
