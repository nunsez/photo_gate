<div style="display: flex; flex-direction: column; align-items: center; gap: 1rem">
  <div>
    <img id="pending-image" src="@{picture.path}" style="width: auto; height: 750px" />
  </div>

  <p style="margin: 0">@{picture.path}</p>

  <div style="display: flex; gap: 3rem">
    <button onclick="accept('@{picture.path}')" style="color: green; font-size: 3rem">ACCEPT</button>
    <button onclick="decline('@{picture.path}')" style="color: red; font-size: 3rem">DECLINE</button>
  </div>

  <script>
    async function accept(src) {
      const body = JSON.stringify({ src });
      const result = await fetch("/accept", { method: "POST", body, headers: { "Content-Type": "application/json" } });
      if (result.ok) {
        location.replace("/");
      }
    }

    async function decline(src) {
      const body = JSON.stringify({ src });
      const result = await fetch("/decline", { method: "POST", body, headers: { "Content-Type": "application/json" } });
      if (result.ok) {
        location.replace("/");
      }
    }
  </script>
</div>
