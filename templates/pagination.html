<nav style="display: flex; gap: 1rem;">
  @if pagination.has_prev()
  <a id="prev-page" href="@{ctx.build_page_url(pagination.current - 1)}">←</a>
  @else
  <span>←</span>
  @end

  @for entry in pagination.range
    @if entry == 0
    <span>...</span>
    @else
    <a href="@{ctx.build_page_url(entry)}">@{entry}</a>
    @end
  @end

  @if pagination.has_next()
  <a id="next-page" href="@{ctx.build_page_url(pagination.current + 1)}">→</a>
  @else
  <span>→</span>
  @end

  <div data-on:keydown__window="
    if (evt.target.tagName === 'INPUT' || evt.target.tagName === 'TEXTAREA') { return; }
    evt.key === 'ArrowLeft' && document.querySelector('#prev-page')?.click();
    evt.key === 'ArrowRight' && document.querySelector('#next-page')?.click();
  "></div>
</nav>
