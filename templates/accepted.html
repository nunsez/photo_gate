<div>
  <div style="margin-bottom: 2rem;">
    <!-- BUG -->
    @include './search.html'
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 2rem;">
    @for picture in result.items
    <div
      id="@{picture.dom_id()}"
      style="display: flex; flex-direction: column; align-items: center; gap: 1rem;"
    >
      <a style="display: block; width: 500px; height: 500px;" href="@{picture.path}" target="_blank">
        <img
          src="@{picture.path}"
          title="@{picture.path}"
          loading="lazy"
          style="
            display: block;
            object-fit: contain;
            object-position: bottom;
            aspect-ratio: 1;
            width: 100%;
            height: 100%;
          "
        />
      </a>
      <div data-signals:page-kind="'@{PageKind.accepted}'" style="display: flex; gap: 2rem;">
        <button data-on:click="@@patch('/pending/@{picture.id}')" style="color: yellow; font-size: 2rem;">PENDING</button>
        <button data-on:click="@@patch('/decline/@{picture.id}')" style="color: red; font-size: 2rem;">DECLINE</button>
      </div>
    </div>
    @end
  </div>

  <div style="margin: 2rem 0; display: flex; justify-content: center;">
    <!-- BUG -->
    @include './pagination.html'
  </div>
</div>
